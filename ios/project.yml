name: NBWebMap
options:
  bundleIdPrefix: vn.nguyenban
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.6.0'
    CURRENT_PROJECT_VERSION: '8'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: NO
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 154.0.0
targets:
  NBWebMap:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.nguyenban.nbwebmap
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: THOVE-NB
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: WebRTC
      - target: Broadcast
        embed: true
  Broadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Shared]
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.nguyenban.nbwebmap.Broadcast
        CODE_SIGN_ENTITLEMENTS: Broadcast/Broadcast.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Live - THOVE-NB
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
schemes:
  NBWebMap:
    build:
      targets:
        NBWebMap: all
    archive:
      config: Release
