<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>👑 LIVE MAP AOV ⚡ RADAR VIP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="cyber-bg" aria-hidden="true"></div>
  <div class="cyber-glow glow-1" aria-hidden="true"></div>
  <div class="cyber-glow glow-2" aria-hidden="true"></div>

  <main>
    <header class="bio-header">
      <div class="conqueror-avatar-wrapper">
        <div class="avatar-container">
          <img id="profileAvatar" src="/thove-nb-logo.jpg" alt="Avatar Ma Giáo AOV">
        </div>
      </div>
      <div class="brand-copy">
        <div class="brand-title-wrap">
          <h1 class="name-box">LIVE MAP AOV</h1>
          <div class="name-crown" title="Vương Miện Thách Đấu - Ma Giáo AOV">
            <i class="fa-solid fa-crown"></i>
            <span class="crown-sparkle">✦</span>
          </div>
        </div>
        <div class="badge-user">
          <span class="user-handle">Ma Giáo AOV</span>
          <span class="eyebrow-divider">|</span>
          <span class="pulse-indicator"></span>
          <span class="eyebrow-tag">RADAR VIP</span>
        </div>
      </div>
      <div class="header-status-area">
        <a href="https://bio-magiao-aov.vercel.app/" target="_blank" rel="noopener noreferrer" class="btn-back-bio" title="Bio Link VIP">
          <i class="fa-solid fa-arrow-left"></i>
          <span>👑 Bio VIP</span>
        </a>
        <span id="badge"><i aria-hidden="true"></i>CHỜ TÍN HIỆU</span>
      </div>
    </header>

    <section id="stage">
      <span class="corner top-left" aria-hidden="true"></span>
      <span class="corner top-right" aria-hidden="true"></span>
      <span class="corner bottom-left" aria-hidden="true"></span>
      <span class="corner bottom-right" aria-hidden="true"></span>
      <div class="stage-scanline" aria-hidden="true"></div>
      <div class="stage-crosshair" aria-hidden="true"></div>
      
      <video id="map" autoplay muted playsinline autopictureinpicture hidden aria-label="Radar Mini-Map"></video>
      <button id="tapToPlay" type="button" class="btn-tap-to-play" hidden>
        <i class="fa-solid fa-play"></i>
        <span>CHẠM ĐỂ XEM BẢN ĐỒ</span>
      </button>
      <div id="placeholder">
        <div class="radar-scope-ring">
          <div class="radar-sweep"></div>
          <i class="fa-solid fa-satellite-dish radar-center-icon"></i>
        </div>
        <strong class="placeholder-title">CHỜ TÍN HIỆU RADAR</strong>
        <p class="placeholder-desc">Chờ tín hiệu từ máy phát...</p>
      </div>
    </section>

    <form id="join">
      <div class="field-item">
        <label for="password">
          <span class="label-text">MẬT KHẨU</span>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">🔒</span>
            <input id="password" type="password" maxlength="128" autocomplete="current-password" placeholder="Mật khẩu phòng...">
          </div>
        </label>
      </div>
      <button class="join-button" type="submit">
        <span class="btn-label">VÀO PHÒNG</span>
      </button>
    </form>

    <footer>
      <div class="viewer-actions">
        <button id="pip" class="pip" type="button"><i class="fa-regular fa-window-restore"></i> PiP</button>
        <button id="stop" class="stop" type="button"><i class="fa-solid fa-stop"></i> Dừng</button>
      </div>
      <p id="status" role="status">Chờ kết nối...</p>
      <button id="fullscreen" class="fullscreen" type="button"><i class="fa-solid fa-expand"></i> Toàn màn hình</button>
    </footer>

    <p id="metrics" class="metrics">0 FPS · Ping --</p>

    <div class="section-tag">
      <i class="fa-solid fa-fire"></i> KÊNH MẠNG XÃ HỘI
    </div>
    <nav class="socials-grid">
      <a href="https://www.tiktok.com/@magiaoaov" target="_blank" rel="noopener noreferrer" class="social-btn social-tiktok">
        <svg class="social-icon tiktok-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 3 15.68 6.34 6.34 0 0 0 9.35 22a6.33 6.33 0 0 0 6.33-6.32V8.92a8.28 8.28 0 0 0 4.84 1.57v-3.8z"/>
        </svg>
        <span>TikTok</span>
      </a>
      <a href="https://t.me/Magiao_AOV" target="_blank" rel="noopener noreferrer" class="social-btn social-telegram">
        <svg class="social-icon telegram-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
        </svg>
        <span>Telegram</span>
      </a>
    </nav>
    <div class="brand-footer-text">
      <span>Ma Giáo AOV</span> · <span>Live Radar VIP</span>
    </div>
  </main>
  <script src="/viewer.js"></script>
</body>
</html>
